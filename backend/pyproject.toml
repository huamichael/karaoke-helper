# Backend project file, managed with uv.
#
# Declares the Python version and dependencies for the API, the grading layers
# and the song pipeline. Each owner adds the packages their task needs.
#
# Owner: B; C and D add their own dependencies. Spec: docs/PROJECT_PLAN.md, section 6.

[project]
name = "karaoke-helper-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

# PyTorch: CPU-only builds on Linux (WSL2 and Docker). PyPI's default Linux
# wheels bundle several GB of CUDA libraries that no team machine can use.
# macOS keeps the normal PyPI wheels.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
