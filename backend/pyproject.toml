# Backend project file, managed with uv.
#
# Declares the Python version and dependencies for the API, the grading layers
# and the song pipeline. Each owner adds the packages their task needs.
#
# Owner: B; C and D add their own dependencies. Spec: docs/PROJECT_PLAN.md, section 6.

[project]
name = "karaoke-helper-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # faster-whisper 1.2.1's decode_audio passes metadata_errors, which PyAV 19 removed.
    "av>=14,<19",               # B: audio decoding; D: build_song --check
    "edge-tts>=7",              # D: spoken word clips (needs internet when generating)
    "fastapi>=0.142.2",         # B
    "faster-whisper>=1.2.1",    # B
    "jieba>=0.42",              # D: word segmentation
    "mlx-whisper>=0.4.3 ; sys_platform == 'darwin'",  # B
    "numpy>=2.5.3",             # shared: audio arrays
    "praat-parselmouth>=0.4",   # D: pitch tracking for tone
    "pydantic>=2.13.5",         # B: shared types
    "pypinyin>=0.55",           # D: Hanzi to pinyin
    "python-multipart>=0.0.32", # B
    "torch==2.11.*",           # C: local CPU acoustic model
    "torchaudio==2.11.*",      # C: MMS_FA and forced_align
    "pyyaml>=6",                # D: lyrics.yaml
    # D: jieba 0.42 imports pkg_resources, which setuptools removes after 81.
    "setuptools>=70,<82",
    "uvicorn>=0.54.0",          # B
    "zhconv>=1.4",              # D: Traditional to Simplified, for segmentation
]


# PyTorch: CPU-only builds on Linux (WSL2 and Docker). PyPI's default Linux
# wheels bundle several GB of CUDA libraries that no team machine can use.
# macOS keeps the normal PyPI wheels.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::SyntaxWarning",                          # jieba 0.42 uses old regex escapes
    "ignore:pkg_resources is deprecated:UserWarning", # jieba 0.42; setuptools is pinned below 82
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
