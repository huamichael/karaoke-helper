# How to split phrases into words (chips) where the automatic split is wrong.
words:
  我愛你: 我 愛 你
  有多深: 有 多深
  不移: 不移
# English translation of each line, matched by its exact text.
translations:
  你問我愛你有多深: "You ask me how deeply I love you"
  我愛你有幾分: "How much I love you"
  我的情也真 我的愛也真: "My feelings are true, my love is true"
  月亮代表我的心: "The moon represents my heart"
  我的情不移 我的愛不變: "My feelings won't waver, my love won't change"
  輕輕的一個吻: "One gentle kiss"
  已經打動我的心: "Has already touched my heart"
  深深的一段情: "A deep, deep love"
  教我思念到如今: "Has kept me longing until now"
  你去想一想 你去看一看: "Go and think it over, go and take a look"
# English meaning of each word, shown in Word practice.
glosses:
  你: "you"
  問: "to ask"
  我: "I, me"
  愛: "to love; love"
  有: "to have"
  多深: "how deep"
  幾分: "how much"
  的: "(possessive particle)"
  情: "feelings"
  也: "also"
  真: "true"
  月亮: "moon"
  代表: "to represent"
  心: "heart"
  不移: "unwavering"
  不變: "unchanging"
  輕輕: "gently"
  一個: "one, a"
  吻: "kiss"
  已經: "already"
  打動: "to touch, to move"
  深深: "deeply"
  一段: "a stretch of"
  教: "to make, to cause"
  思念: "to long for"
  到: "until"
  如今: "now"
  去: "to go"
  想一想: "to think it over"
  看一看: "to take a look"
