# How to split phrases into words (chips) where the automatic split is wrong.
words:
  好一朵: 好 一朵
  又香又白人人誇: 又 香 又 白 人人 誇
  別人家: 別人家
# English translation of each line, matched by its exact text.
translations:
  好一朵美麗的茉莉花: "What a beautiful jasmine flower"
  芬芳美麗滿枝椏: "Fragrant and lovely, filling the branches"
  又香又白人人誇: "So fragrant and so white, everyone praises it"
  讓我來將你摘下 送給別人家: "Let me pick you and give you to someone else"
  茉莉花呀茉莉花: "Oh jasmine flower, jasmine flower"
# English meaning of each word, shown in Word practice.
glosses:
  好: "how (exclamation)"
  一朵: "one (flower)"
  美麗: "beautiful"
  的: "(possessive particle)"
  茉莉花: "jasmine flower"
  芬芳: "fragrant"
  滿: "full of"
  枝椏: "branches"
  又: "both, also"
  香: "fragrant"
  白: "white"
  人人: "everyone"
  誇: "to praise"
  讓: "to let"
  我: "I, me"
  來: "to come"
  將: "(marks the object)"
  你: "you"
  摘下: "to pick"
  送給: "to give to"
  別人家: "someone else's home"
  呀: "(exclamation)"
