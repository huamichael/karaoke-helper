metadata:
  title: Yi Jian Mei (xue hua piao piao bei feng xiao xiao)
  artist: Fei Yu-ching
  album: ميكس Yi Jian Mei (xue hua piao piao bei feng xiao xiao)
  duration_ms: 235000
  instrumental: false
# Characters this song sings differently from pypinyin's reading. Each phrase is
# fixed wherever it appears; give one pinyin_numeric reading per character.
readings:
  掩没: yan3 mo4    # 没 means "bury" here, not "not have"
  长留: chang2 liu2 # "remain long", not "grow"
# How to split phrases into words (chips) where the automatic split is wrong.
words:
  总有: 总有
  开过: 开过
  北风萧萧: 北风 萧萧
  一翦寒梅: 一翦 寒梅
  雪中: 雪中
  只为: 只为
  心间: 心间
# English translation of each line, matched by its exact text.
translations:
  真情像草原广阔: "True love is as vast as the grasslands"
  层层风雨不能阻隔: "Layer upon layer of wind and rain cannot keep it apart"
  总有云开日出时候: "There will always come a time when the clouds part and the sun rises"
  万丈阳光照耀你我: "Boundless sunlight shining on you and me"
  真情像梅花开过: "True love is like the plum blossom in bloom"
  冷冷冰雪不能掩没: "Cold ice and snow cannot bury it"
  就在最冷枝头绽放: "It blooms on the coldest branch"
  看见春天走向你我: "Seeing spring walk toward you and me"
  雪花飘飘 北风萧萧: "Snowflakes drifting, the north wind howling"
  天地 一片 苍茫: "Heaven and earth, one vast expanse"
  一翦寒梅 傲立雪中: "A sprig of winter plum stands proudly in the snow"
  只为 伊人 飘香: "Giving its fragrance only for the one I love"
  爱我所爱 无怨无悔: "Loving whom I love, without complaint or regret"
  此情 长留 心间: "This love stays forever in my heart"
